# SEED 1 of the stain_macenko run.
#
# Identical to stain_macenko.yaml in every field but seed. run_id is shared across the three
# seeds on purpose: src.train writes to <run_id>_seed<seed>.
#
# Run: python -m src.train --config configs/stain_macenko_seed1.yaml

# stain_macenko: the stain-normalisation arm of the comparative study.
#
# Identical to baseline.yaml in every field but data.stain_norm, so a difference
# between this arm and the baseline is the normalisation and nothing else.
#
# Macenko (2009), via torchstain, so this arm is the literature method rather than our
# reading of it.
#
# READ src/data/stain.py BEFORE INTERPRETING THIS RUN. Macenko assumes H&E histology
# with a near-white background; PBC is Wright-Giemsa on a tinted one. Measured over 40
# pbc_train images it cannot map its own reference onto itself (46.8 mean-RGB shift
# against Reinhard's 0.5) and leaves most of a synthetic tint gap in place on
# eosinophils. It is run unmodified anyway: this arm exists to measure what the
# published method does on blood smears, so a poor result is a finding about the
# method and not a tuning failure.
#
# Run: python -m scripts.precompute_stain --config configs/stain_macenko.yaml
#      python -m src.train --config configs/stain_macenko.yaml

run_id: stain_macenko

env: kaggle
seed: 1
device: cuda                # cpu | cuda | mps; mps is for smoke/debug only

paths:
  local:
    pbc_images: data/raw/PBC_dataset_normal_DIB
    wbcatt_dir: data/raw
    raabin_root: data/raw/raabin_double_labeled
    lisc_root: data/raw/LISC
    results_dir: results
  kaggle:
    pbc_images: /kaggle/input/datasets/anikakrishnaa/pbc-images/PBC_dataset_normal_DIB
    wbcatt_dir: /kaggle/input/datasets/anikakrishnaa/wbcatt
    raabin_root: /kaggle/input/datasets/anikakrishnaa/raabin-double-labeled
    lisc_root: /kaggle/input/datasets/anikakrishnaa/lisc   # out of scope; expected absent
    results_dir: /kaggle/working/results

data:
  class_mapping: configs/class_mapping.yaml
  label_space: configs/label_space.yaml   # fixes what class/attribute index 0 MEANS
  source: pbc_wbcatt          # the 10,298 WBCAtt-labelled PBC images, WBCAtt's splits
  image_size: 224
  subset_n_images: null       # set to 500 for the sec 7 smoke test
  normalization:              # fixed ImageNet constants, never computed from data
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  # Every split -- train, val, source test and every target domain. An arm trained on
  # normalised images and evaluated on raw ones would report a pipeline artefact as a
  # domain drop (CLAUDE.md sec 3).
  stain_norm:
    method: macenko
    reference: configs/stain_reference.yaml   # pbc_train only, chosen by script
    cache: true                               # see src/data/stain_cache.py

model:
  type: baseline
  backbone: resnet50
  backbone_norm: batchnorm   # headline arm; groupnorm is the secondary arm
  # null downloads them. On Kaggle, attach the weights as a dataset and point
  # this at the /kaggle/input path. Neither available is a hard error - it is
  # never a silent fall back to random init (CLAUDE.md sec 5).
  imagenet_weights: null

train:
  epochs: 30
  batch_size: 32
  lr: 0.0003
  optimizer: adamw            # fixed a priori; not a tuned axis
  weight_decay: 0.0001
  lr_schedule: cosine         # cosine decay after a short linear warmup
  warmup_epochs: 2            # identical across all three models, never tuned
  class_weighting: none       # none | inverse_frequency; fixed a priori

  # Training only, source only, and identical for baseline, bottleneck and control -
  # otherwise the three are compared across different protocols, not representations.
  # Blood smears have no canonical orientation, so flips and full rotation preserve
  # both the class and all 11 attributes.
  augmentation:
    hflip: 0.5
    vflip: 0.5
    rotation_degrees: 180
    # Stain colour variation IS the shift being measured, so these are fixed a priori
    # and never tuned; src/config.py caps them. Raising a cap is a protocol change.
    color_jitter:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      hue: 0.02


eval:
  # Three separate Raabin domains; no pooled Raabin headline number.
  # LISC was never obtained and is out of scope (CLAUDE.md sec 2).
  domains: [pbc_test, raabin_train, raabin_testA, raabin_testB]

  secondary_subsets: [pbc_test_no_band_neutrophils]
  abstention:
    threshold_split: pbc_val  # the threshold is chosen on source val, never on target
    coverage_grid: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 1.0]
  ece_bins: 15
  macro_f1_over: present_classes   # raabin_testB has 2 of 5 classes; see src/config.py

bootstrap:
  enabled: true
  n: 2000
  ci: 0.95
  stratify_by: class
  resample_domains_independently: true

selection:
  # The evaluated checkpoint is the final epoch of the declared budget. pbc_val cannot
  # support an argmax over epochs, and a per-model argmax selected the three models at
  # different points on their own learning curves (CLAUDE.md sec 5).
  rule: final_epoch
  report_metric: val_macro_f1   # recorded per epoch; selects nothing
  # Reads the TRAINING loss. A guard on a falling val metric would be epoch selection
  # under another name. A run that fires it yields no checkpoint at all.
  divergence_guard: non_finite_loss
