# Model 2b of 5: stain normalisation, Reinhard (2001).
#
#   python -m src.train --config configs/model2b_reinhard.yaml
#
# Identical to model1_direct_cnn except for the stain normalisation step. Reinhard
# matches per-channel mean and standard deviation in LAB space, assuming the shift
# between labs is a global colour transfer.
#
# Reference: configs/stain_reference.yaml, from the PBC TRAIN split only
# (CLAUDE.md section 3). Diagnostics in reports/stain_normalisation.md: Reinhard maps
# its reference onto itself to within 0.5 mean-RGB and closes a synthetic tint gap from
# 32.9 to 0.3, so unlike Macenko its assumptions hold on this data.
#
# Reported separately from Macenko rather than averaged into one "stain normalisation"
# row: they are different algorithms and collapsing them would hide which one worked.
run_id: model2b_reinhard
seeds: [0, 1, 2]
deterministic: true

model:
  kind: baseline_cnn
  arch: resnet50
  pretrained: true
  num_classes: 5

data:
  dataset: pbc
  split: train
  image_size: 224           # fixed for the whole project; numbers at other sizes are not comparable
                            # (the Phase II deck says ~360 px; 224 chosen 2026-11-05 to match
                            #  ImageNet pretraining and the compute budget -- update the deck)
  normalize: imagenet
  stain_norm:               # applied to EVERY split, train and eval alike
    method: reinhard
  augment: true             # flips and quarter turns only -- NOT colour jitter, which would
                            # confound the bottleneck comparison (src/data/transforms.py)
  batch_size: 32
  num_workers: 0

train:
  epochs: 30
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  # Plain cross-entropy. Neutrophils are 32% of train and basophils 12%, so class
  # weighting is a reasonable thing to try -- but as its own run, not folded into the
  # baseline, or the control arm is already an intervention.
  selection:
    dataset: pbc
    split: val
  early_stopping:
    metric: macro_f1
    patience: 5

eval:
  datasets:
    - {dataset: pbc, split: val}
    - {dataset: pbc, split: test}
