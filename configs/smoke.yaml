# Smoke config. CLAUDE.md section 7: every new pipeline runs on a 500-image subset for
# 2 epochs before any full run. This is not an experiment and its numbers are not
# reportable -- it exists to prove the pipeline executes end to end.
#
#   python -m src.train --config configs/smoke.yaml

run_id: smoke
seeds: [0]
deterministic: true

model:
  kind: baseline_cnn
  arch: resnet18
  pretrained: true
  num_classes: 5

data:
  dataset: pbc
  split: train
  image_size: 224
  normalize: imagenet       # ImageNet constants, not statistics measured from any split
  augment: true             # geometric only; see src/data/transforms.py for why
  batch_size: 16
  num_workers: 0            # 0 on Windows; worker startup cost exceeds the gain here
  subset_size: 500          # smoke only; a full run must not set this
  subset_seed: 0            # fixed, so every seed sees the same 500 images

train:
  epochs: 2
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  selection:                # checkpoint chosen on the PBC val split, never on target data
    dataset: pbc
    split: val
    subset_size: 200        # smoke only, to keep the per-epoch evaluation quick
  early_stopping:
    metric: macro_f1
    patience: 5

eval:
  # Source domain only. Target domains are touched once, by the eval harness, with the
  # checkpoint already chosen (CLAUDE.md section 3).
  datasets:
    - {dataset: pbc, split: val, subset_size: 200}
