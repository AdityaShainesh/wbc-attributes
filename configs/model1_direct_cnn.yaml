# Model 1 of 5: Direct CNN. An ImageNet-pretrained ResNet-50 predicting the 5-part
# differential straight from pixels, with no stain normalisation, no colour augmentation
# and no domain adaptation. Sets the cross-lab drop that models 2-5 have to beat.
#
#   python -m src.train --config configs/model1_direct_cnn.yaml
#
# PROTOCOL -- identical for all five models, including the teammate's bottleneck:
# ResNet-50 backbone, 224 px, same splits, same seeds, same metrics. Anything changed
# here must be changed in every other model's config, or the comparison is void.
#
# Reports the mean +- std over three seeds. Source domain only: the source->target drop
# is produced later by the eval harness, once, with these checkpoints already chosen.

run_id: model1_direct_cnn
seeds: [0, 1, 2]
deterministic: true

model:
  kind: baseline_cnn
  arch: resnet50
  pretrained: true
  num_classes: 5

data:
  dataset: pbc
  split: train
  image_size: 224           # fixed for the whole project; numbers at other sizes are not comparable
                            # (the Phase II deck says ~360 px; 224 chosen 2026-11-05 to match
                            #  ImageNet pretraining and the compute budget -- update the deck)
  normalize: imagenet
  augment: true             # flips and quarter turns only -- NOT colour jitter, which would
                            # confound the bottleneck comparison (src/data/transforms.py)
  batch_size: 32
  num_workers: 0

train:
  epochs: 30
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  # Plain cross-entropy. Neutrophils are 32% of train and basophils 12%, so class
  # weighting is a reasonable thing to try -- but as its own run, not folded into the
  # baseline, or the control arm is already an intervention.
  selection:
    dataset: pbc
    split: val
  early_stopping:
    metric: macro_f1
    patience: 5

eval:
  datasets:
    - {dataset: pbc, split: val}
    - {dataset: pbc, split: test}
